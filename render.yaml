services:
  # Backend API service
  - type: web
    name: urlshortener-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: BASE_URL
        fromService:
          name: urlshortener-frontend
          type: web
          property: url
      - key: CORS_ORIGIN
        fromService:
          name: urlshortener-frontend
          type: web
          property: url

  # Frontend static site
  - type: web
    name: urlshortener-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: urlshortener-api
          type: web
          property: url
